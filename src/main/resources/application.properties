spring.application.name=documind

# === OpenAI (spring-ai-starter-model-openai) ===
# API key comes from the environment; never hardcode a secret.
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Chat model used to generate grounded answers. gpt-6-luna is OpenAI's current-gen
# cheap/high-volume tier (verified against the live models page 2026-10-27); it
# replaces the end-of-life gpt-4o-mini. Step up to gpt-6.1-terra for more headroom.
spring.ai.openai.chat.model=gpt-6-luna

# Embedding model. Spring AI 2.x flat property (NOT the old .options.model form).
# text-embedding-3-small emits 1536-dimensional vectors.
spring.ai.openai.embedding.model=text-embedding-3-small

# === Elasticsearch vector store (spring-ai-starter-vector-store-elasticsearch) ===
# ES connection (uris/credentials) is auto-wired from the Compose container via
# Boot's docker-compose + service-connection support, so no uris are set here.
#
# initialize-schema defaults to false in Spring AI 2.x (a breaking change), so we
# opt in to let the store create the index. dimensions must equal the embedding
# model's output size (1536 for text-embedding-3-small).
spring.ai.vectorstore.elasticsearch.initialize-schema=true
spring.ai.vectorstore.elasticsearch.index-name=documind-chunks
spring.ai.vectorstore.elasticsearch.dimensions=1536
spring.ai.vectorstore.elasticsearch.similarity=cosine

# === PDF chunking (PdfDocumentChunker -> TokenTextSplitter) ===
# chunk-size is the per-chunk token budget; min-chunk-size-chars is the splitter's
# punctuation-trim threshold. TokenTextSplitter has no overlap setting, so there is
# no overlap property to set.
documind.chunking.chunk-size=800
documind.chunking.min-chunk-size-chars=350

# === Retrieval ===
# How many chunks QuestionAnsweringService places into the grounded context (and so the
# maximum number of citations an answer carries).
documind.retrieval.top-k=4

# Hybrid retrieval (Slice 3): BM25 + vector kNN fused by Reciprocal Rank Fusion in the
# adapter (ES-native RRF is Enterprise-licensed → 403 on basic). Default OFF keeps the
# vector-only path byte-identical to the Slice-2 baseline for a clean A/B; flip on with
# -Ddocumind.retrieval.hybrid.enabled=true. candidate-k is the per-list depth fused down
# to top-k; rrf-k is the RRF rank constant (standard 60). Treated as measured knobs.
documind.retrieval.hybrid.enabled=false
documind.retrieval.hybrid.candidate-k=20
documind.retrieval.hybrid.rrf-k=60

# Agentic retrieval (Slice 4): retrieve -> LLM sufficiency gate -> if insufficient,
# reformulate the query and retry. Default OFF = single-shot (the Slice-3 path, unchanged).
# max-iterations counts retrieval passes: 2 = one initial search + at most one reformulated
# retry (a fired loop = 2 extra chat calls: gate + reformulation). The final context is
# capped to top-k, so the generator sees the same chunk budget as single-shot. Uses the
# ChunkStore above (vector-only or hybrid, per its own flag) as the retrieval primitive.
documind.retrieval.agentic.enabled=false
documind.retrieval.agentic.max-iterations=2
