services:
  elasticsearch:
    image: 'docker.elastic.co/elasticsearch/elasticsearch:9.3.3'
    environment:
      - 'ELASTIC_PASSWORD=secret'
      - 'discovery.type=single-node'
      - 'xpack.security.enabled=false'
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    mem_limit: 1g
    volumes:
      - 'es-data:/usr/share/elasticsearch/data'
    ports:
      - '9200'
      - '9300'

volumes:
  es-data:
